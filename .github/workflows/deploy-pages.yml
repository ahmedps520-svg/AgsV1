# Builds the static export and publishes it to GitHub Pages on every push to
# main.
#
# ONE-TIME SETUP: GitHub only lets a repository administrator turn Pages on,
# and the workflow token does not have that right on a personal repository.
# Once, in the browser: Settings → Pages → "Build and deployment" → Source →
# "GitHub Actions". After that every run deploys automatically. Until then
# the build still runs and the artifact is kept, but the deploy job is
# skipped with a notice.
#
# To point the site at a real Supabase project instead of the built-in demo,
# add these repository *variables* (Settings → Secrets and variables → Actions
# → Variables). They are public by design — the anon key is meant for browsers
# and every request it makes is still filtered by Row Level Security.
#
#   NEXT_PUBLIC_SUPABASE_URL       https://<ref>.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  <anon / publishable key>
#
# Never add SUPABASE_SERVICE_ROLE_KEY here: a static site cannot keep a secret.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and type-check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
        # Fails only when Pages has not been switched on yet (see the note at
        # the top of this file). The build below still runs so the artifact is
        # ready the moment it is.
        continue-on-error: true

      - name: Build static export
        env:
          # configure-pages reports "/AgsV1" for this project site; fall back
          # to the same value when Pages is not enabled yet.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '/AgsV1' }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin || 'https://ahmedps520-svg.github.io' }}${{ steps.pages.outputs.base_path || '/AgsV1' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Pages not enabled yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=GitHub Pages is not enabled::Open Settings → Pages and set Source to 'GitHub Actions', then re-run this workflow. The site was built and is ready to publish."

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
