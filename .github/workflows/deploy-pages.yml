# Builds the static export and publishes it to GitHub Pages on every push to
# main.
#
# It supports EVERY way GitHub can serve Pages, so it stays green whichever is
# configured under Settings → Pages → "Build and deployment" → Source:
#
#   • "Deploy from a branch" → main / (root)   ← the current setting
#         The build job commits the static export to the root of main
#         (scripts/publish-to-root.mjs) and GitHub serves it as-is.
#   • "Deploy from a branch" → gh-pages / (root)
#         The build job force-pushes the export to gh-pages.
#   • "GitHub Actions"
#         The deploy job below publishes the uploaded artifact.
#
# To point the site at the real Supabase project,
# add these repository *variables* (Settings → Secrets and variables → Actions
# → Variables). They are public by design — the anon key is meant for browsers
# and every request it makes is still filtered by Row Level Security.
#
#   NEXT_PUBLIC_SUPABASE_URL       https://<ref>.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  <anon / publishable key>
#
# Never add SUPABASE_SERVICE_ROLE_KEY here: a static site cannot keep a secret.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # force-pushes the built site to gh-pages
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.pages_source.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to rebase the publish commit if main moved

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and type-check
        run: |
          npm run lint
          npx tsc --noEmit
          # supabase/install.sql is generated from the migrations; a migration
          # added without regenerating it would silently ship a stale schema.
          node scripts/build-install-sql.mjs --check

      - name: Build static export
        env:
          # Project Pages sites are served from /<repo>, whichever source is
          # used. A custom domain would serve from the root instead.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || format('/{0}', github.event.repository.name) }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # Serves "Deploy from a branch → main / (root)". Pushes made with the
      # workflow token do not trigger workflows, and [skip ci] guards it too.
      - name: Publish the built site into the root of main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish-to-root.mjs
          git add -A
          if git diff --cached --quiet; then
            echo "Published site is already up to date."
            exit 0
          fi
          git commit -q -m "Publish site for ${GITHUB_SHA::7} [skip ci]"
          git push -q origin HEAD:main \
            || { git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main; }
          echo "::notice title=Published::Built site committed to the root of main."

      # Serves the "Deploy from a branch → gh-pages" configuration.
      - name: Publish to the gh-pages branch
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "::notice title=Published::Built site force-pushed to the gh-pages branch."

      # Serves the "Source = GitHub Actions" configuration.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # deploy-pages only works when the site's build type is "workflow";
      # against a branch-served site it would fail the run, so check first.
      - name: Read the Pages source
        id: pages_source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          type=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
                 | jq -r '.build_type // "none"')
          echo "build_type=$type" >> "$GITHUB_OUTPUT"
          echo "Pages build type: $type"
          if [ "$type" != "workflow" ]; then
            echo "::notice title=Pages source::Set Source to 'GitHub Actions', or point 'Deploy from a branch' at gh-pages / root."
          fi

  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
