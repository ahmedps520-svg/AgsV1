# Builds the static export and publishes it to GitHub Pages on every push to
# main. The first run also enables Pages on the repository.
#
# To point the site at a real Supabase project instead of the built-in demo,
# add these repository *variables* (Settings → Secrets and variables → Actions
# → Variables). They are public by design — the anon key is meant for browsers
# and every request it makes is still filtered by Row Level Security.
#
#   NEXT_PUBLIC_SUPABASE_URL       https://<ref>.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  <anon / publishable key>
#
# Never add SUPABASE_SERVICE_ROLE_KEY here: a static site cannot keep a secret.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and type-check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Enable Pages and read its base path
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static export
        env:
          # configure-pages reports e.g. "/AgsV1" for a project site.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
