# Local development configuration for the Supabase CLI.
# Docs: https://supabase.com/docs/guides/local-development
project_id = "map-dismissals"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback/",
  "https://ahmedps520-svg.github.io/AgsV1/auth/callback/",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false
enable_manual_linking = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[inbucket]
enabled = true
port = 54324
